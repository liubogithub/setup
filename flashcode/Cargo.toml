[package]
name = "flashcode"
version = "0.1.0"
edition = "2021"
description = "A minimal coding agent CLI powered by DeepSeek (OpenAI-compatible)"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
dirs = "5"
anyhow = "1"
clap = { version = "4", features = ["derive"] }

[profile.release]
lto = true
strip = true
